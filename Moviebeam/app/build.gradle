            storeFile file('D:\\Projects\\Moviebeam\\Production\\moviebeam_prod.jks')
            storePassword 'diipl@123'
            keyAlias 'key0'
            keyPassword 'diipl@123'
        }
    }

    lint {
        baseline = file("lint-baseline.xml")
    }

    namespace 'com.diipl.moviebeam'
    compileSdk 33

    defaultConfig {
        applicationId "com.diipl.moviebeam"
        minSdk 24
        targetSdk 33
        versionCode 1
        versionName "2.6.00"

        def formattedDate = new Date().format('yyyyMMdd')
        def apkName = "Moviebeam_Prod_V(${versionName})_$formattedDate"

        setProperty("archivesBaseName", apkName)

    }

    buildFeatures {
        viewBinding = true
        dataBinding = true
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.debug
        }
    }


    compileOptions {
        targetCompatibility JavaVersion.VERSION_1_8
        sourceCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_1_8
    }

}

